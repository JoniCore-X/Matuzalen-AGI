<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matuzalen AGI - Chat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f1a;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background: #1a1a2e;
            padding: 16px 24px;
            border-bottom: 1px solid #2a2a4a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 { font-size: 18px; color: #7c83ff; }
        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #999;
        }
        .dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #555;
        }
        .dot.active { background: #4caf50; box-shadow: 0 0 8px #4caf50; }
        .thoughts {
            background: #12121f;
            padding: 8px 24px;
            font-size: 12px;
            color: #888;
            border-bottom: 1px solid #2a2a4a;
            max-height: 60px;
            overflow: hidden;
        }
        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .msg {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .msg.user {
            align-self: flex-end;
            background: #7c83ff;
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .msg.agent {
            align-self: flex-start;
            background: #1e1e32;
            border: 1px solid #2a2a4a;
            border-bottom-left-radius: 4px;
        }
        .msg.thinking { color: #888; font-style: italic; }
        form {
            display: flex;
            gap: 12px;
            padding: 16px 24px;
            background: #1a1a2e;
            border-top: 1px solid #2a2a4a;
        }
        input {
            flex: 1;
            padding: 14px 16px;
            border-radius: 8px;
            border: 1px solid #2a2a4a;
            background: #0f0f1a;
            color: #e0e0e0;
            font-size: 15px;
            outline: none;
        }
        input:focus { border-color: #7c83ff; }
        button {
            padding: 14px 24px;
            border-radius: 8px;
            border: none;
            background: #7c83ff;
            color: #fff;
            font-size: 15px;
            cursor: pointer;
            font-weight: 600;
        }
        button:disabled { background: #444; cursor: not-allowed; }
        button:hover:not(:disabled) { background: #6a71ee; }
    </style>
</head>
<body>
    <header>
        <h1>Matuzalen AGI</h1>
        <div class="status">
            <span class="dot" id="dot"></span>
            <span id="state">conectando...</span>
        </div>
    </header>
    <div class="thoughts" id="thoughts">Conciencia: esperando...</div>
    <div id="messages"></div>
    <form id="form">
        <input id="input" type="text" placeholder="Escribe tu mensaje..." autocomplete="off" autofocus>
        <button id="send" type="submit">Enviar</button>
    </form>

    <script>
        const messages = document.getElementById('messages');
        const form = document.getElementById('form');
        const input = document.getElementById('input');
        const send = document.getElementById('send');

        function addMsg(text, cls) {
            const div = document.createElement('div');
            div.className = 'msg ' + cls;
            div.textContent = text;
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
            return div;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = input.value.trim();
            if (!text) return;
            addMsg(text, 'user');
            input.value = '';
            send.disabled = true;
            const thinking = addMsg('Pensando...', 'agent thinking');
            try {
                const r = await fetch('/api/chat/simple', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({message: text})
                });
                const data = await r.json();
                thinking.remove();
                addMsg(data.agent_response || data.error || 'Sin respuesta', 'agent');
            } catch (err) {
                thinking.remove();
                addMsg('Error: ' + err.message, 'agent');
            }
            send.disabled = false;
            input.focus();
        });

        async function updateState() {
            try {
                const r = await fetch('/api/consciousness/state');
                const s = await r.json();
                document.getElementById('state').textContent = s.state;
                document.getElementById('dot').className = 'dot' + (s.is_running ? ' active' : '');
                if (s.recent_thoughts && s.recent_thoughts.length) {
                    document.getElementById('thoughts').textContent =
                        'Conciencia: ' + s.recent_thoughts[s.recent_thoughts.length - 1];
                }
            } catch (e) {}
        }
        updateState();
        setInterval(updateState, 5000);
    </script>
</body>
</html>
