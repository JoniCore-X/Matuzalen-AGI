<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matuzalen</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a14;
            --surface: #141420;
            --surface-2: #1c1c2c;
            --border: #2a2a3d;
            --text: #f0f0f5;
            --muted: #9090a8;
            --accent: #7c83ff;
            --accent-2: #00d4ff;
            --success: #00e676;
            --user: #7c83ff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
        }

        .app {
            height: 100vh;
            display: flex;
            flex-direction: column;
            max-width: 900px;
            margin: 0 auto;
            border-left: 1px solid var(--border);
            border-right: 1px solid var(--border);
            background: var(--surface);
        }

        header {
            padding: 16px 24px;
            background: var(--surface-2);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 15px;
            color: #fff;
        }

        .brand-text h1 {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        .brand-text p {
            font-size: 12px;
            color: var(--muted);
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--muted);
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #555;
        }

        .dot.online { background: var(--success); box-shadow: 0 0 8px var(--success); }

        .toolbar {
            display: flex;
            gap: 8px;
        }

        .toolbar button {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .toolbar button:hover {
            border-color: var(--accent);
            color: var(--text);
        }

        .toolbar button.active {
            background: rgba(124, 131, 255, 0.15);
            border-color: var(--accent);
            color: var(--text);
        }

        .main {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .message {
            max-width: 80%;
            padding: 14px 16px;
            border-radius: 16px;
            line-height: 1.55;
            font-size: 15px;
            white-space: pre-wrap;
            word-wrap: break-word;
            animation: in 0.25s ease;
        }

        @keyframes in {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            background: var(--user);
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .message.agent {
            align-self: flex-start;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
            color: var(--text);
        }

        .message.typing {
            color: var(--muted);
            font-style: italic;
        }

        .input-area {
            padding: 16px 24px;
            background: var(--surface-2);
            border-top: 1px solid var(--border);
        }

        .input-box {
            display: flex;
            gap: 10px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 6px;
        }

        .input-box input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 15px;
            padding: 12px 14px;
            outline: none;
        }

        .input-box input::placeholder { color: var(--muted); }

        .input-box button {
            padding: 10px 20px;
            background: var(--accent);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }

        .input-box button:disabled { background: #3a3a55; cursor: not-allowed; }

        .context-drawer {
            width: 320px;
            background: var(--surface-2);
            border-left: 1px solid var(--border);
            display: none;
            flex-direction: column;
            overflow-y: auto;
            padding: 20px;
        }

        .context-drawer.open { display: flex; }

        .context-title {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--muted);
            margin-bottom: 14px;
        }

        .card {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 14px;
        }

        .card h3 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text);
        }

        .card p {
            font-size: 13px;
            color: var(--muted);
            line-height: 1.5;
        }

        .next-step {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }

        .next-step:last-child { border-bottom: none; padding-bottom: 0; }

        .next-step .num {
            width: 22px;
            height: 22px;
            background: rgba(124, 131, 255, 0.2);
            color: var(--accent);
            border-radius: 50%;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .next-step .txt {
            font-size: 13px;
            color: var(--text);
        }

        .empty {
            font-size: 13px;
            color: var(--muted);
            text-align: center;
            padding: 24px;
        }

        .typing-dots {
            display: inline-flex;
            gap: 4px;
            align-items: center;
            padding: 4px 0;
        }

        .typing-dots span {
            width: 6px;
            height: 6px;
            background: var(--muted);
            border-radius: 50%;
            animation: blink 1.4s infinite both;
        }

        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes blink {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        @media (max-width: 640px) {
            .context-drawer {
                position: absolute;
                right: 0;
                top: 0;
                bottom: 0;
                width: 280px;
                z-index: 10;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <header>
            <div class="brand">
                <div class="avatar">M</div>
                <div class="brand-text">
                    <h1>Matuzalen</h1>
                    <p>Tu asistente estratégico</p>
                </div>
            </div>
            <div class="toolbar">
                <button id="btn-context" onclick="toggleContext()">Ver mi situación</button>
            </div>
            <div class="status">
                <span class="dot online" id="dot"></span>
                <span id="state-text">En linea</span>
            </div>
        </header>

        <div class="main">
            <section class="chat-area">
                <div class="messages" id="messages"></div>
                <div class="input-area">
                    <form class="input-box" id="form">
                        <input id="input" type="text" placeholder="Escribe a Matuzalen..." autocomplete="off" autofocus>
                        <button id="send" type="submit">Enviar</button>
                    </form>
                </div>
            </section>

            <aside class="context-drawer" id="context-drawer">
                <div class="context-title">Tu situación</div>
                <div id="context-content">
                    <div class="empty">Aún no hay un plan activo.</div>
                </div>
            </aside>
        </div>
    </div>

    <script>
        const messages = document.getElementById('messages');
        const form = document.getElementById('form');
        const input = document.getElementById('input');
        const send = document.getElementById('send');
        const drawer = document.getElementById('context-drawer');
        const contextBtn = document.getElementById('btn-context');
        const userId = 'user-001';

        function addMsg(text, cls) {
            const div = document.createElement('div');
            div.className = 'message ' + cls;
            if (cls === 'typing') {
                div.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
            } else {
                div.innerHTML = escapeHtml(text);
            }
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
            return div;
        }

        function escapeHtml(text) {
            return text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/\n/g, '<br>');
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = input.value.trim();
            if (!text) return;
            addMsg(text, 'user');
            input.value = '';
            send.disabled = true;

            const thinking = addMsg('', 'typing');

            try {
                const r = await fetch('/api/chat/simple', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({message: text, user_id: userId})
                });
                const data = await r.json();
                thinking.remove();
                addMsg(data.agent_response || 'No tengo respuesta ahora.', 'agent');
                if (data.context_injected) loadContext();
            } catch (err) {
                thinking.remove();
                addMsg('No pude conectar. Intenta de nuevo.', 'agent');
            }
            send.disabled = false;
            input.focus();
        });

        function toggleContext() {
            drawer.classList.toggle('open');
            contextBtn.classList.toggle('active');
            contextBtn.textContent = drawer.classList.contains('open') ? 'Ocultar' : 'Ver mi situación';
        }

        async function loadContext() {
            try {
                const r = await fetch('/api/plan/context?user_id=' + userId);
                if (!r.ok) throw new Error('Sin plan');
                const ctx = await r.json();
                const container = document.getElementById('context-content');

                let html = '';

                if (ctx.plan_nombre) {
                    html += `
                        <div class="card">
                            <h3>${ctx.plan_nombre}</h3>
                            <p>${ctx.proposito}</p>
                        </div>
                    `;
                }

                if (ctx.next_steps && ctx.next_steps.length) {
                    html += '<div class="context-title">Proximos pasos</div>';
                    html += '<div class="card">';
                    ctx.next_steps.forEach((step, i) => {
                        html += `
                            <div class="next-step">
                                <span class="num">${i + 1}</span>
                                <span class="txt">${step.descripcion}</span>
                            </div>
                        `;
                    });
                    html += '</div>';
                }

                if (ctx.critical_risks && ctx.critical_risks.length) {
                    html += '<div class="context-title">Puntos de atencion</div>';
                    html += '<div class="card">';
                    ctx.critical_risks.forEach(risk => {
                        html += `<p style="margin-bottom:8px;">- ${risk.descripcion}</p>`;
                    });
                    html += '</div>';
                }

                container.innerHTML = html || '<div class="empty">No hay informacion disponible.</div>';
            } catch (e) {
                document.getElementById('context-content').innerHTML = '<div class="empty">Aun no hay un plan activo.</div>';
            }
        }

        async function updateState() {
            try {
                const r = await fetch('/api/consciousness/state');
                const s = await r.json();
                document.getElementById('dot').className = 'dot ' + (s.is_running ? 'online' : '');
                document.getElementById('state-text').textContent = s.is_running ? 'En linea' : 'Descansando';
            } catch (e) {}
        }

        loadContext();
        updateState();
        setInterval(updateState, 10000);
    </script>
</body>
</html>
