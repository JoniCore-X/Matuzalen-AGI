version: '3.8'

services:
  # Qdrant - Memoria Semántica (Vector Database)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_cognitive
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped
    networks:
      - cognitive_network

  # Neo4j - Grafo de Conocimiento (Graph Database)
  neo4j:
    image: neo4j:5.15.0-community
    container_name: neo4j_cognitive
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    environment:
      - NEO4J_AUTH=neo4j/ultron_cognitive_2026
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=512m
    restart: unless-stopped
    networks:
      - cognitive_network

  # Redis - Caché de Estado Rápido
  redis:
    image: redis:7-alpine
    container_name: redis_cognitive
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - cognitive_network

volumes:
  qdrant_data:
  neo4j_data:
  neo4j_logs:
  redis_data:

networks:
  cognitive_network:
    driver: bridge